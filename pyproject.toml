[project]
name = "oracle-lens-reconstruction"
version = "0.1.0"
description = "Oracle lens for Qwen3.6-27B"
requires-python = ">=3.12"
dependencies = ["numpy", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olens"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
extend-select = [
  "I",     # isort — ruff owns import ordering too
  "E501",  # line too long — not in ruff's defaults, and `ruff format` never wraps strings/comments
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.88",
]
