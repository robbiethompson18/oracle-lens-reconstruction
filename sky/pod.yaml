# Oracle-lens pilot pod. Launch (from repo root):
#   uvx --from 'skypilot[runpod]' sky launch -c olens --infra runpod/US --retry-until-up -y --detach-run --env MODEL=Qwen/Qwen3.8-27B sky/pod.yaml
name: olens-pilot
resources:
  cloud: runpod
  accelerators: {H200-SXM:1, B200:1, H100-SXM:1}
  disk_size: 400
envs:
  MODEL: Qwen/Qwen3.6-27B
  HF_HOME: /hf
  HF_XET_HIGH_PERFORMANCE: 1
  HF_HUB_ENABLE_HF_TRANSFER: 0
setup: |
  set -euo pipefail
  nvidia-smi --query-gpu=driver_version,name,memory.total --format=csv
  curl -LsSf https://astral.sh/uv/install.sh | sh
  mkdir -p /hf /work
  grep -q "HF_HOME=/hf" ~/.bashrc || echo "export HF_HOME=/hf" >> ~/.bashrc
  cd ~ && ~/.local/bin/uv venv -q --python 3.12 ~/venv
  export VIRTUAL_ENV=~/venv
  ~/.local/bin/uv pip install -q 'vllm==0.31.0' 'peft==0.21.2' 'trl==1.16.0' datasets safetensors 'huggingface_hub[hf_xet]' numpy scipy pyyaml wandb pytest
  ~/.local/bin/uv pip install -q 'flash-linear-attention==0.5.2' || echo "FLA INSTALL FAILED"
  ~/.local/bin/uv pip install -q --no-build-isolation 'causal-conv1d==1.7.0' || echo "CAUSAL_CONV1D INSTALL FAILED"
  ~/venv/bin/python -c "import torch, vllm, transformers, peft, trl; print('torch', torch.__version__, 'vllm', vllm.__version__, 'transformers', transformers.__version__, 'peft', peft.__version__, 'trl', trl.__version__, torch.cuda.get_device_name(0))"
  ~/venv/bin/python -c "import fla; print('fla ok')" || echo "FLA IMPORT FAILED"
  ~/venv/bin/python -c "import causal_conv1d; print('causal_conv1d ok')" || echo "CAUSAL_CONV1D IMPORT FAILED"
  ~/venv/bin/hf download $MODEL > /dev/null
  echo SETUP_DONE
run: |
  echo ready
